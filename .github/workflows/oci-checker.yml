name: OCI Appointment Checker

on:
  schedule:
    - cron: '*/10 * * * *'   # every 10 minutes (triggered reliably via cron-job.org)
  workflow_dispatch:          # allow manual runs from GitHub UI

jobs:
  check-slots:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run OCI slot checker
        id: checker
        env:
          NTFY_TOPIC:        ${{ secrets.NTFY_TOPIC }}
          CUTOFF_DATE:       ${{ vars.CUTOFF_DATE }}
          CANCEL_COUNT:      ${{ vars.CANCEL_COUNT }}
          APP_REF_NO:        ${{ secrets.APP_REF_NO }}
          PASSPORT_NUMBER:   ${{ secrets.PASSPORT_NUMBER }}
          FIRST_NAME:        ${{ secrets.FIRST_NAME }}
          LAST_NAME:         ${{ secrets.LAST_NAME }}
          DATE_OF_BIRTH:     ${{ secrets.DATE_OF_BIRTH }}
          MOBILE_NUMBER:     ${{ secrets.MOBILE_NUMBER }}
          EMAIL:             ${{ secrets.EMAIL }}
          NATIONALITY_VALUE: ${{ secrets.NATIONALITY_VALUE }}
          ADDRESS:           ${{ secrets.ADDRESS }}
        run: |
          python3 oci_checker.py
          EXIT=$?
          echo "exit_code=$EXIT" >> $GITHUB_OUTPUT
          # exit 0 = no slots, exit 1 = slots found — both are not errors
          # exit 2 = real script error — propagate so job turns red
          if [ $EXIT -eq 2 ]; then exit 2; fi
          exit 0

      - name: Write job summary
        if: always()
        run: |
          echo "## OCI Checker — $(date -u '+%Y-%m-%d %H:%M UTC')" >> $GITHUB_STEP_SUMMARY
          CODE="${{ steps.checker.outputs.exit_code }}"
          if [ "$CODE" = "1" ]; then
            echo "### ✅ SLOTS AVAILABLE — book now!" >> $GITHUB_STEP_SUMMARY
            echo "👉 https://appointment.indianembassyberlin.gov.in" >> $GITHUB_STEP_SUMMARY
          elif [ "$CODE" = "2" ]; then
            echo "### ❌ Script error — check the logs." >> $GITHUB_STEP_SUMMARY
          else
            echo "### No slots available." >> $GITHUB_STEP_SUMMARY
          fi
